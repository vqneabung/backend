<!DOCTYPE html>
<!-- Register page — web-based user registration (Thymeleaf) -->
<!-- Khi submit, RegisterController.kt xử lý:
     1. Validate email, password (min 6), confirm password
     2. Kiểm tra email đã tồn tại → redirect /register?error=duplicate
     3. Hash password → save user → redirect /login?registered -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizflow - Create Account</title>
    <!-- Shared stylesheet — dùng chung với login.html -->
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
</head>
<body>
    <div class="auth-container">
        <h1>Bizflow</h1>
        <p>Create your account</p>

        <!-- Hiển thị nếu email đã tồn tại: RegisterController redirect /register?error=duplicate -->
        <div th:if="${param.error}" class="error-message">
            <span th:if="${param.error[0] == 'duplicate'}">This email is already registered.</span>
            <span th:if="${param.error[0] != 'duplicate'}">Something went wrong. Please try again.</span>
        </div>
        <!-- Hiển thị nếu vừa đăng ký thành công: RegisterController redirect /register?registered -->
        <div th:if="${param.registered}" class="success-message">
            Account created successfully! Please sign in.
        </div>

        <!-- POST /register — RegisterController xử lý (KHÔNG phải Spring Security filter) -->
        <form id="registerForm" th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" name="email"
                       placeholder="you@example.com" required autofocus />
            </div>
            <div class="form-group">
                <label for="registerName">Name (optional)</label>
                <input type="text" id="registerName" name="name"
                       placeholder="Nguyen Van A" />
            </div>
            <div class="form-group">
                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" name="password"
                       placeholder="At least 6 characters" required />
            </div>
            <div class="form-group">
                <label for="registerConfirmPassword">Confirm Password</label>
                <input type="password" id="registerConfirmPassword" name="confirmPassword"
                       placeholder="Re-enter your password" required />
            </div>
            <!-- CSRF token bắt buộc cho POST form — Thymeleaf tự sinh -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </div>
    </div>

    <!-- JustValidate CDN library — phải load trước auth-validation.js -->
    <script src="https://cdn.jsdelivr.net/npm/just-validate@4.3.0/dist/just-validate.production.min.js"></script>
    <!-- Shared validation logic — auto-detects register form by ID -->
    <script th:src="@{/js/auth-validation.js}"></script>
</body>
</html>
