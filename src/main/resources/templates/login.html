<!DOCTYPE html>
<!-- Login page — Spring Security form login (Thymeleaf) -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizflow - Sign In</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
</head>
<body>
    <div class="auth-container">
        <h1>Bizflow</h1>
        <p>Sign in to your account</p>

        <div th:if="${param.error}" class="error-message">
            Invalid email or password.
        </div>
        <div th:if="${param.logout}" class="logout-message">
            You have been signed out.
        </div>

        <form id="loginForm" th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" name="username"
                       placeholder="you@example.com" required autofocus />
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password"
                       placeholder="Enter your password" required />
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="auth-footer">
            Bizflow Platform
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/just-validate@4.3.0/dist/just-validate.production.min.js"></script>
    <script th:src="@{/js/auth-validation.js}"></script>
</body>
</html>
