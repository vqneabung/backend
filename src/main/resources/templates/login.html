<!DOCTYPE html>
<!-- Login page — Spring Security form login (Thymeleaf) -->
<!-- Khi submit, Spring Security tự động xử lý:
     1. Lấy giá trị name="username" và name="password"
     2. Gọi UserDetailsServiceImpl.loadUserByUsername(username)
     3. So sánh password với BCryptPasswordEncoder
     4. Thành công → redirect về URL gốc (chẳng hạn /oauth2/authorize?...) -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizflow - Sign In</title>
    <!-- Shared stylesheet — dùng chung với register.html -->
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
</head>
<body>
    <div class="auth-container">
        <h1>Bizflow</h1>
        <p>Sign in to your account</p>

        <!-- Hiển thị nếu login sai: Spring redirect /login?error -->
        <div th:if="${param.error}" class="error-message">
            Invalid email or password.
        </div>
        <!-- Hiển thị nếu vừa logout: Spring redirect /login?logout -->
        <div th:if="${param.logout}" class="logout-message">
            You have been signed out.
        </div>
        <!-- Hiển thị nếu vừa đăng ký thành công: RegisterController redirect /login?registered -->
        <div th:if="${param.registered}" class="success-message">
            Account created successfully! Please sign in.
        </div>

        <!-- POST /login — Spring Security form login filter bắt và xử lý -->
        <form id="loginForm" th:action="@{/login}" method="post">
            <div class="form-group">
                <!-- name="username" — Spring Security mặc định đọc field này (dù là email) -->
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" name="username"
                       placeholder="you@example.com" required autofocus />
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password"
                       placeholder="Enter your password" required />
            </div>
            <!-- CSRF token bắt buộc cho POST form — Thymeleaf tự sinh -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a th:href="@{/register}">Create one</a>
        </div>
    </div>

    <!-- JustValidate CDN library — phải load trước auth-validation.js -->
    <script src="https://cdn.jsdelivr.net/npm/just-validate@4.3.0/dist/just-validate.production.min.js"></script>
    <!-- Shared validation logic — auto-detects login form by ID -->
    <script th:src="@{/js/auth-validation.js}"></script>
</body>
</html>
