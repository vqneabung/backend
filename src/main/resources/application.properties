spring.application.name=backend

# ===== Database: SQL Server =====
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:5144;databaseName=bizflow;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# validate = chỉ kiểm tra entity vs table, không tự tạo bảng (dùng Flyway)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# ===== Flyway Database Migration =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ===== JWT =====
# Thời gian sống của JWT (milliseconds). Default: 86400000 = 24 giờ
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== OAuth2 Authorization Server =====
# URL của auth server — xuất hiện trong iss claim của JWT + OIDC discovery
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER:http://localhost:8080}

# ===== OAuth2 Client — Next.js =====
app.oauth2.nextjs.client-secret=${NEXTJS_CLIENT_SECRET:nextjs-secret}
app.oauth2.nextjs.redirect-uri=${NEXTJS_REDIRECT_URI:http://localhost:3000/api/auth/callback/oidc}
app.oauth2.nextjs.post-logout-redirect-uri=${NEXTJS_POST_LOGOUT_URI:http://localhost:3000/}

# ===== OAuth2 Client — Laravel Admin =====
app.oauth2.laravel.client-secret=${LARAVEL_CLIENT_SECRET:admin-secret}
app.oauth2.laravel.redirect-uri=${LARAVEL_REDIRECT_URI:http://localhost:8000/admin/callback}

# ===== SpringDoc OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
springdoc.info.title=Bizflow API
springdoc.info.description=REST API for Bizflow Digital Transformation Platform
springdoc.info.version=0.0.1

# ===== Scalar API Documentation (UI thay thế Swagger) =====
scalar.enabled=true
scalar.url=/v3/api-docs
scalar.path=/scalar
scalar.pageTitle=Bizflow API Documentation
scalar.theme=purple
scalar.layout=modern
scalar.darkMode=true
scalar.showSidebar=true
scalar.defaultOpenAllTags=true