spring.application.name=backend

# SQL Server connection
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:5144;databaseName=bizflow;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:my-256-bit-secret-key-that-is-at-least-32-bytes-long-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
springdoc.info.title=Bizflow API
springdoc.info.description=REST API for Bizflow Digital Transformation Platform
springdoc.info.version=0.0.1

# Scalar API Documentation
scalar.enabled=true
scalar.url=/v3/api-docs
scalar.path=/scalar
scalar.pageTitle=Bizflow API Documentation
scalar.theme=purple
scalar.layout=modern
scalar.darkMode=true
scalar.showSidebar=true
scalar.defaultOpenAllTags=true